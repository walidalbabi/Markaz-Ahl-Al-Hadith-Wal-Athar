# Release workflow — builds the app from the PRIVATE source repo and
# publishes verifiable artifacts here.
#
# Triggers:
#   - push of a tag v*  -> real release (a tag with the same name must
#     exist in walidalbabi/ahl-al-hadith; the build uses that source tag)
#   - workflow_dispatch -> dry run: builds + attests, publishes a DRAFT
#     release for inspection (delete it afterwards)
#
# Secrets/variables required (see docs/RELEASING.md in the source repo):
#   SOURCE_REPO_TOKEN, ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ENV_JSON_B64,
#   and the repository variable EXPECTED_CERT_SHA256.
#
# No secret value is ever echoed; GitHub Actions masks them in logs.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref of walidalbabi/ahl-al-hadith to build (dry run -> draft release)"
        required: true
        default: "master"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: walidalbabi/ahl-al-hadith
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Record source commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Restore env.json and keystore from secrets
        env:
          ENV_JSON_B64: ${{ secrets.ENV_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ENV_JSON_B64" | base64 -d > env.json
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build AAB and split-per-abi APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release --dart-define-from-file=env.json
          flutter build apk --release --split-per-abi --dart-define-from-file=env.json

      - name: Collect artifacts and generate checksums
        run: |
          mkdir dist
          cp build/app/outputs/bundle/release/app-release.aab dist/
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          cp docs/VERIFY.md dist/
          cd dist
          sha256sum *.apk *.aab > checksums.txt
          cat checksums.txt

      - name: Verify signing certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          ACTUAL=$("$BT/apksigner" verify --print-certs dist/app-arm64-v8a-release.apk \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Built-APK certificate SHA-256: $ACTUAL"
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::EXPECTED_CERT_SHA256 repository variable is not set. Set it to the fingerprint above (source repo docs/RELEASING.md, section 1.2)."
            exit 1
          fi
          EXP=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ': ')
          ACT=$(printf '%s' "$ACTUAL" | tr 'A-F' 'a-f' | tr -d ': ')
          if [ "$EXP" != "$ACT" ]; then
            echo "::error::Signing certificate mismatch - the APK was NOT signed by the expected key. Refusing to release."
            exit 1
          fi
          echo "Certificate matches EXPECTED_CERT_SHA256."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab
            dist/checksums.txt

      - name: Compose release notes
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          {
            cat <<'HEADER'
          تطبيق مركز أهل الحديث والأثر: فصول صوتية مباشرة، قنوات منفصلة للرجال والنساء، عضوية مُراجَعة، محادثات، ومكتبة تسجيلات الدروس. عربي أولاً، من اليمين إلى اليسار.

          The official app of Markaz Ahl Al-Hadith Wal-Athar: live audio classrooms, gender-segregated channels, vetted membership, chat, and an archived lecture library. Arabic-first, RTL throughout.

          ### أي ملف أحمّل؟ / Which file do I download?
          Most phones (2019 or newer): **app-arm64-v8a-release.apk**. Older 32-bit phones: **app-armeabi-v7a-release.apk**. The `.aab` is for Google Play only — it cannot be installed directly.

          ### التحقق / Verify your download
          Full instructions (Arabic + English): **VERIFY.md**, attached below.
          HEADER
            echo ""
            echo "**Signing certificate SHA-256 (permanent — identical for every release):**"
            echo '```'
            echo "$EXPECTED_CERT_SHA256"
            echo '```'
            echo ""
            echo "### SHA-256 checksums"
            echo '```'
            cat dist/checksums.txt
            echo '```'
            echo ""
            echo "### Build provenance"
            echo "Built by this repository's GitHub Actions workflow from"
            echo "\`walidalbabi/ahl-al-hadith@$SOURCE_SHA\` (private source, tag \`$TAG\`)."
            echo "Verify cryptographically with the [GitHub CLI](https://cli.github.com):"
            echo '```'
            echo "gh attestation verify <file> -R ${{ github.repository }}"
            echo '```'
          } > notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Dry run (draft — delete me)' || github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.apk
            dist/*.aab
            dist/checksums.txt
            dist/VERIFY.md
